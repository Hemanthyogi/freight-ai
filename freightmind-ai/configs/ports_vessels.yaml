    port_cost_usd_call: 45000
    hire_rate_usd_day_ref: 18000
    suitable_cargo: ["coal", "iron_ore", "grain", "fertilizer"]
    notes: "Workhorse of bulk trade; good East Coast India compatibility"

  - type: "Panamax"
    dwt_mt: 75000
