# ============================================================
# VESSEL MASTER DATA
# Specifications are representative class averages.
# Individual vessels will vary.
# ============================================================
vessels:
  - type: "Handysize"
    dwt_mt: 28000
    cargo_capacity_mt: 26500      # ~95% DWT usable
    draft_laden_m: 9.8
    draft_ballast_m: 5.5
    loa_m: 180.0
    beam_m: 28.0
    speed_laden_kn: 13.5
    speed_ballast_kn: 14.5
    fuel_consumption_mt_day: 22.0
    port_cost_usd_call: 35000
    hire_rate_usd_day_ref: 12000   # reference; market-driven
    suitable_cargo: ["coal", "grain", "fertilizer", "steel", "general_bulk"]
    notes: "Most flexible; fits most ports"

  - type: "Supramax"
    dwt_mt: 58000
    cargo_capacity_mt: 55100
